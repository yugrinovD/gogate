name: gogate

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gogate}
      POSTGRES_USER: ${POSTGRES_USER:-gogate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make init-env}
    ports:
      - "${GOGATE_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${GOGATE_REDIS_PASSWORD:?run make init-env}", "--appendonly", "yes"]
    ports:
      - "${GOGATE_REDIS_PORT:-6380}:6379"
    volumes:
      - redis:/data
    environment:
      REDIS_PASSWORD: ${GOGATE_REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  gogate:
    build:
      context: .
      args:
        VERSION: ${GOGATE_VERSION:-dev}
        COMMIT: ${GOGATE_COMMIT:-unknown}
        DATE: ${GOGATE_DATE:-unknown}
    image: gogate:local
    restart: unless-stopped
    env_file: .env
    ports:
      - "${GOGATE_HTTP_PORT:-8080}:8080"
      - "${GOGATE_ADMIN_PORT:-9090}:9090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "${GOGATE_PROM_PORT:-9092}:9090"
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
      - prometheus:/prometheus
    depends_on:
      - gogate

  grafana:
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?run make init-env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "${GOGATE_GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:1.57.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${GOGATE_JAEGER_PORT:-16686}:16686"
      - "${GOGATE_OTLP_PORT:-4318}:4318"
    depends_on:
      - gogate

  ollama:
    image: ollama/ollama:0.40.16@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
    profiles: ["llm"]
    restart: unless-stopped
    ports:
      - "${GOGATE_OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

  mock-upstream:
    image: gogate:local
    profiles: ["load"]
    restart: "no"
    entrypoint: ["/app/gogate-mockupstream"]
    environment:
      MOCK_ADDR: ":8081"
      MOCK_MODELS: "mock,mock-fast"
      MOCK_CHUNK_DELAY_MS: "0"
    ports:
      - "${GOGATE_MOCK_PORT:-8081}:8081"
    depends_on:
      gogate:
        condition: service_started

  k6:
    image: grafana/k6:0.56.0
    profiles: ["load"]
    environment:
      BASE_URL: http://gogate:8080
      API_KEY: ${K6_API_KEY:-}
      DURATION: ${K6_DURATION:-2m}
      RATE: ${K6_RATE:-500}
    volumes:
      - ./k6:/scripts:ro
      - ./build:/reports
    command: ["run", "/scripts/chat.js"]
    depends_on:
      - gogate

volumes:
  postgres:
  redis:
  prometheus:
  grafana:
  ollama:
