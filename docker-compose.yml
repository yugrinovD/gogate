name: gogate

services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gogate}
      POSTGRES_USER: ${POSTGRES_USER:-gogate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make init-env}
    ports:
      - "127.0.0.1:${GOGATE_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${GOGATE_REDIS_PASSWORD:?run make init-env}", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${GOGATE_REDIS_PORT:-6380}:6379"
    volumes:
      - redis:/data
    environment:
      REDIS_PASSWORD: ${GOGATE_REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  gogate:
    build:
      context: .
      args:
        VERSION: ${GOGATE_VERSION:-dev}
        COMMIT: ${GOGATE_COMMIT:-unknown}
        DATE: ${GOGATE_DATE:-unknown}
    image: gogate:local
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${GOGATE_HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${GOGATE_ADMIN_PORT:-9090}:9090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus:v2.55.1@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${GOGATE_PROM_PORT:-9092}:9090"
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
      - prometheus:/prometheus
    depends_on:
      - gogate

  grafana:
    image: grafana/grafana:11.6.0@sha256:62d2b9d20a19714ebfe48d1bb405086081bc602aa053e28cf6d73c7537640dfb
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?run make init-env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:${GOGATE_GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:1.57.0@sha256:8f165334f418ca53691ce358c19b4244226ed35c5d18408c5acf305af2065fb9
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:${GOGATE_JAEGER_PORT:-16686}:16686"
      - "127.0.0.1:${GOGATE_OTLP_PORT:-4318}:4318"
    depends_on:
      - gogate

  # Standalone development LLM profile. Full-stack deployments use infra/.
  # Do not run this profile together with the full stack: two Ollama
  # containers mean two model volumes and double the RAM usage.
  ollama:
    image: ollama/ollama:0.40.16@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
    profiles: ["ai", "llm"]
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    ports:
      - "127.0.0.1:${GOGATE_OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

  # One-shot model pull. The model is never baked into the image.
  ollama-pull:
    image: ollama/ollama:0.40.16@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
    profiles: ["ai", "llm"]
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-qwen2.5:3b}"]
    volumes:
      - ollama:/root/.ollama

  mock-upstream:
    image: gogate:local
    profiles: ["load"]
    restart: "no"
    entrypoint: ["/app/gogate-mockupstream"]
    environment:
      MOCK_ADDR: ":8081"
      MOCK_MODELS: "mock,mock-fast"
      MOCK_CHUNK_DELAY_MS: "0"
    ports:
      - "127.0.0.1:${GOGATE_MOCK_PORT:-8081}:8081"
    depends_on:
      gogate:
        condition: service_started

  k6:
    image: grafana/k6:0.56.0@sha256:89684628f98358ba6cc1a2e604bf2b05d49aad43611ece73a44aafcec06fcf28
    profiles: ["load"]
    environment:
      BASE_URL: http://gogate:8080
      API_KEY: ${K6_API_KEY:-}
      DURATION: ${K6_DURATION:-2m}
      RATE: ${K6_RATE:-500}
    volumes:
      - ./k6:/scripts:ro
      - ./build:/reports
    command: ["run", "/scripts/chat.js"]
    depends_on:
      - gogate

volumes:
  postgres:
  redis:
  prometheus:
  grafana:
  ollama:
